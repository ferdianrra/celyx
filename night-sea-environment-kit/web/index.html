<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Night Sea Preview</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;overflow:hidden;background:#04061a;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #sky{visibility:hidden}            /* the star layer is only a texture for the shader */
  #env{cursor:grab}
  #hint{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);pointer-events:none;
    padding:10px 18px;border-radius:999px;background:rgba(12,14,30,.42);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.88);font:500 13px/1.2 -apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif;
    white-space:nowrap;transition:opacity 1.2s ease}
  #hint.off{opacity:0}
  #nogl{position:fixed;inset:0;display:grid;place-items:center;color:#cfd6ff;font:15px system-ui,sans-serif;text-align:center;padding:24px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="env" aria-label="Night sky over a calm sea with islands. Drag to look around, pinch or scroll to zoom."></canvas>
<div id="hint">Drag to look around · pinch or scroll to zoom</div>
<div id="nogl" hidden>This preview needs WebGL, which this browser has turned off.</div>
<!-- optional: planets and a more exact Sun/Moon. Without it (offline) the sky still works. -->
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<script>window.MW_SRC="assets/milky-way-radec.jpg"</script>
<script src="stars.js"></script>
<script src="shader.js"></script>
<script src="env.js"></script>
<script>{const h=document.getElementById("hint"),off=()=>h.classList.add("off");setTimeout(off,6000);addEventListener("pointerdown",()=>setTimeout(off,800),{once:true})}</script>
</body>
</html>
